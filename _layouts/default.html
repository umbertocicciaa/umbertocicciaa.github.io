<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    <meta name="description" content="Portfolio and resume of Umberto Domenico Ciccia - Cloud Engineer, System Engineer, Software Engineer">
    <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
</head>
<body>
    <div class="page-shell">
        <header class="site-header">
            <div class="brand">
                <a class="brand-name" href="{{ '/' | relative_url }}">{{ site.title | default: "Umberto Domenico Ciccia" }}</a>
            </div>
            <nav class="site-nav">
                <a href="#about">About</a>
                <a href="#projects">Projects</a>
                <a href="#experience">Experience</a>
                <a href="#skills">Skills</a>
                <a href="#certifications">Certifications</a>
                <a href="#contact">Contact</a>
            </nav>
        </header>
        <main class="site-main">
            {{ content }}
        </main>
        <footer class="site-footer">
            <p>&copy; {{ "now" | date: "%Y" }} Umberto Domenico Ciccia</p>
        </footer>
    </div>
</body>
</html>
