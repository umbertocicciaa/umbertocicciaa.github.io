<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    <meta name="description" content="Portfolio and resume of Umberto Domenico Ciccia">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
</head>
<body class="{{ page.layout }}-page">
    <div class="page-shell">
        <div class="page-background" aria-hidden="true"></div>
        <header class="site-header">
            <div class="brand">
                <span class="brand-mark"></span>
                <a class="brand-name" href="{{ '/' | relative_url }}">{{ site.title | default: "Umberto Domenico Ciccia" }}</a>
            </div>
            <nav id="primary-navigation" class="site-nav" data-nav-links>
                <a href="#about">About</a>
                <a href="#projects">Projects</a>
                <a href="#experience">Experience</a>
                <a href="#skills">Skills</a>
                <a href="#certifications">Certifications</a>
                <a href="#contact">Contact</a>
            </nav>
            <button class="nav-toggle" aria-label="Toggle navigation" aria-controls="primary-navigation" aria-expanded="false" data-nav-toggle>
                <span></span>
                <span></span>
                <span></span>
            </button>
        </header>
        <main class="site-main">
            {{ content }}
        </main>
        <footer class="site-footer">
            <p>&copy; {{ "now" | date: "%Y" }} Umberto Domenico Ciccia. All rights reserved.</p>
        </footer>
    </div>
    <script>
        const navToggle = document.querySelector('[data-nav-toggle]');
        const navLinks = document.querySelector('[data-nav-links]');

        if (navToggle && navLinks) {
            navToggle.addEventListener('click', () => {
                const isOpen = navToggle.getAttribute('aria-expanded') === 'true';
                navToggle.setAttribute('aria-expanded', String(!isOpen));
                navLinks.classList.toggle('is-open');
            });
        }
    </script>
</body>
</html>
