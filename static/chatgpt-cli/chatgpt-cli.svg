<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d4a3a"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10a37f"/>
      <stop offset="100%" stop-color="#00d4aa"/>
    </linearGradient>
    <radialGradient id="pulse" cx="0.8" cy="0.2" r="0.6">
      <stop offset="0%" stop-color="#10a37f" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#pulse)"/>

  <!-- Terminal window -->
  <rect x="120" y="80" width="960" height="510" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <!-- Title bar -->
  <rect x="120" y="80" width="960" height="44" rx="16" fill="#161b22"/>
  <rect x="120" y="108" width="960" height="16" fill="#161b22"/>
  <!-- Window buttons -->
  <circle cx="152" cy="102" r="7" fill="#ff5f56"/>
  <circle cx="176" cy="102" r="7" fill="#ffbd2e"/>
  <circle cx="200" cy="102" r="7" fill="#27c93f"/>
  <!-- Title text -->
  <text x="600" y="107" fill="#8b949e" font-family="monospace" font-size="14" text-anchor="middle">chatgpt-cli — Go</text>

  <!-- Line 1: prompt command -->
  <text x="152" y="162" fill="#10a37f" font-family="monospace" font-size="18" filter="url(#glow)">$</text>
  <text x="175" y="162" fill="#c9d1d9" font-family="monospace" font-size="18">chatgpt-cli prompt</text>
  <text x="445" y="162" fill="#a5d6ff" font-family="monospace" font-size="18">"Explain Go channels"</text>

  <!-- Response block -->
  <text x="152" y="198" fill="#8b949e" font-family="monospace" font-size="16">Channels in Go are typed conduits through which you</text>
  <text x="152" y="222" fill="#8b949e" font-family="monospace" font-size="16">can send and receive values. They provide a way for</text>
  <text x="152" y="246" fill="#8b949e" font-family="monospace" font-size="16">goroutines to communicate and synchronize execution.</text>

  <!-- Line 2: config command -->
  <text x="152" y="296" fill="#10a37f" font-family="monospace" font-size="18" filter="url(#glow)">$</text>
  <text x="175" y="296" fill="#c9d1d9" font-family="monospace" font-size="18">chatgpt-cli config list</text>

  <!-- Config output -->
  <text x="152" y="330" fill="#7ee787" font-family="monospace" font-size="15">OPENAI_MODEL</text>
  <text x="340" y="330" fill="#8b949e" font-family="monospace" font-size="15">=</text>
  <text x="360" y="330" fill="#a5d6ff" font-family="monospace" font-size="15">gpt-3.5-turbo</text>
  <text x="152" y="354" fill="#7ee787" font-family="monospace" font-size="15">OPENAI_MAX_TOKENS</text>
  <text x="410" y="354" fill="#8b949e" font-family="monospace" font-size="15">=</text>
  <text x="430" y="354" fill="#a5d6ff" font-family="monospace" font-size="15">1000</text>
  <text x="152" y="378" fill="#7ee787" font-family="monospace" font-size="15">OPENAI_TEMPERATURE</text>
  <text x="430" y="378" fill="#8b949e" font-family="monospace" font-size="15">=</text>
  <text x="450" y="378" fill="#a5d6ff" font-family="monospace" font-size="15">0.7</text>
  <text x="152" y="402" fill="#7ee787" font-family="monospace" font-size="15">OPENAI_API_KEY</text>
  <text x="370" y="402" fill="#8b949e" font-family="monospace" font-size="15">=</text>
  <text x="390" y="402" fill="#a5d6ff" font-family="monospace" font-size="15">sk-****...****</text>

  <!-- Line 3: logs command -->
  <text x="152" y="450" fill="#10a37f" font-family="monospace" font-size="18" filter="url(#glow)">$</text>
  <text x="175" y="450" fill="#c9d1d9" font-family="monospace" font-size="18">chatgpt-cli logs</text>
  <text x="152" y="484" fill="#8b949e" font-family="monospace" font-size="15">[1] 2024-01-31 14:30:15 — prompt</text>
  <text x="152" y="506" fill="#8b949e" font-family="monospace" font-size="15">[2] 2024-01-31 14:35:22 — config</text>

  <!-- Blinking cursor -->
  <text x="152" y="556" fill="#10a37f" font-family="monospace" font-size="18" filter="url(#glow)">$</text>
  <rect x="172" y="542" width="11" height="20" fill="#10a37f" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Tech badges -->
  <rect x="930" y="140" width="60" height="24" rx="12" fill="#10a37f" opacity="0.2"/>
  <text x="960" y="157" fill="#10a37f" font-family="sans-serif" font-size="12" text-anchor="middle">Go</text>
  <rect x="1000" y="140" width="70" height="24" rx="12" fill="#10a37f" opacity="0.2"/>
  <text x="1035" y="157" fill="#10a37f" font-family="sans-serif" font-size="12" text-anchor="middle">OpenAI</text>
</svg>
