<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1428"/>
      <stop offset="55%" stop-color="#162040"/>
      <stop offset="100%" stop-color="#1a3a6a"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.35" r="0.55">
      <stop offset="0%" stop-color="#5da8fd" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0c1428" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#64e2d5"/>
      <stop offset="100%" stop-color="#3fb4ff"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9a5c"/>
      <stop offset="100%" stop-color="#ff6b6b"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7ee787"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bc8cff"/>
      <stop offset="100%" stop-color="#7c5dfd"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#halo)"/>

  <!-- Architecture diagram: CLI -> Master -> Worker -> Pipeline -->

  <!-- CLI Box -->
  <rect x="80" y="240" width="180" height="100" rx="14" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.9"/>
  <text x="170" y="280" fill="#64e2d5" font-family="monospace" font-size="14" text-anchor="middle">make-mlops-easy</text>
  <text x="170" y="308" fill="#8b949e" font-family="sans-serif" font-size="13" text-anchor="middle">CLI</text>

  <!-- Arrow CLI -> Master -->
  <line x1="260" y1="290" x2="340" y2="290" stroke="url(#accent)" stroke-width="2" opacity="0.6"/>
  <polygon points="340,284 354,290 340,296" fill="url(#accent)" opacity="0.6"/>
  <text x="300" y="278" fill="#8b949e" font-family="sans-serif" font-size="11" text-anchor="middle">submit</text>

  <!-- Master API Box -->
  <rect x="360" y="210" width="200" height="160" rx="14" fill="rgba(93,139,253,0.12)" stroke="#5d8bfd" stroke-width="2.5"/>
  <text x="460" y="248" fill="#5d8bfd" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Master API</text>
  <text x="460" y="272" fill="#8b949e" font-family="sans-serif" font-size="12" text-anchor="middle">FastAPI + uvicorn</text>
  <!-- state indicator -->
  <rect x="390" y="290" width="140" height="30" rx="8" fill="rgba(93,139,253,0.1)" stroke="#5d8bfd" stroke-width="1" opacity="0.6"/>
  <text x="460" y="310" fill="#a5d6ff" font-family="monospace" font-size="11" text-anchor="middle">workflow_state.json</text>
  <!-- tasks -->
  <rect x="390" y="330" width="140" height="26" rx="8" fill="rgba(126,231,135,0.1)" stroke="#7ee787" stroke-width="1" opacity="0.6"/>
  <text x="460" y="348" fill="#7ee787" font-family="monospace" font-size="11" text-anchor="middle">task_queue: 3 ready</text>

  <!-- Arrow Master -> Worker -->
  <line x1="560" y1="290" x2="640" y2="290" stroke="#7c5dfd" stroke-width="2" opacity="0.6"/>
  <polygon points="640,284 654,290 640,296" fill="#7c5dfd" opacity="0.6"/>
  <text x="600" y="278" fill="#8b949e" font-family="sans-serif" font-size="11" text-anchor="middle">assign</text>

  <!-- Worker Box -->
  <rect x="660" y="210" width="200" height="160" rx="14" fill="rgba(124,93,253,0.12)" stroke="#7c5dfd" stroke-width="2.5"/>
  <text x="760" y="248" fill="#bc8cff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Worker</text>
  <text x="760" y="272" fill="#8b949e" font-family="sans-serif" font-size="12" text-anchor="middle">TaskRunner agent</text>
  <!-- progress bars -->
  <rect x="690" y="294" width="140" height="10" rx="5" fill="rgba(255,255,255,0.08)"/>
  <rect x="690" y="294" width="112" height="10" rx="5" fill="url(#green)" opacity="0.7"/>
  <text x="760" y="322" fill="#8b949e" font-family="monospace" font-size="11" text-anchor="middle">train: 80%</text>
  <rect x="690" y="338" width="140" height="10" rx="5" fill="rgba(255,255,255,0.08)"/>
  <rect x="690" y="338" width="56" height="10" rx="5" fill="url(#orange)" opacity="0.7"/>
  <text x="760" y="366" fill="#8b949e" font-family="monospace" font-size="11" text-anchor="middle">deploy: 40%</text>

  <!-- Arrow Worker -> Pipeline -->
  <line x1="860" y1="290" x2="940" y2="290" stroke="url(#accent)" stroke-width="2" opacity="0.6"/>
  <polygon points="940,284 954,290 940,296" fill="url(#accent)" opacity="0.6"/>
  <text x="900" y="278" fill="#8b949e" font-family="sans-serif" font-size="11" text-anchor="middle">runs</text>

  <!-- Pipeline Box -->
  <rect x="960" y="180" width="200" height="220" rx="14" fill="rgba(100,226,213,0.1)" stroke="url(#accent)" stroke-width="2.5"/>
  <text x="1060" y="216" fill="#64e2d5" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">MLOpsPipeline</text>

  <!-- Pipeline stages -->
  <rect x="984" y="232" width="152" height="28" rx="8" fill="rgba(100,226,213,0.15)"/>
  <text x="1060" y="251" fill="#64e2d5" font-family="monospace" font-size="12" text-anchor="middle">1. Preprocess</text>
  <rect x="984" y="268" width="152" height="28" rx="8" fill="rgba(100,226,213,0.15)"/>
  <text x="1060" y="287" fill="#64e2d5" font-family="monospace" font-size="12" text-anchor="middle">2. Train</text>
  <rect x="984" y="304" width="152" height="28" rx="8" fill="rgba(100,226,213,0.15)"/>
  <text x="1060" y="323" fill="#64e2d5" font-family="monospace" font-size="12" text-anchor="middle">3. Deploy</text>
  <rect x="984" y="340" width="152" height="28" rx="8" fill="rgba(100,226,213,0.15)"/>
  <text x="1060" y="359" fill="#64e2d5" font-family="monospace" font-size="12" text-anchor="middle">4. Observe</text>

  <!-- Bottom: CLI commands showcase -->
  <rect x="120" y="460" width="960" height="150" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5" opacity="0.85"/>
  <text x="152" y="496" fill="#64e2d5" font-family="monospace" font-size="14">$</text>
  <text x="170" y="496" fill="#c9d1d9" font-family="monospace" font-size="14">make-mlops-easy train data.csv --target approved</text>
  <text x="152" y="524" fill="#64e2d5" font-family="monospace" font-size="14">$</text>
  <text x="170" y="524" fill="#c9d1d9" font-family="monospace" font-size="14">make-mlops-easy predict data.csv models/deploy_20240101</text>
  <text x="152" y="552" fill="#64e2d5" font-family="monospace" font-size="14">$</text>
  <text x="170" y="552" fill="#c9d1d9" font-family="monospace" font-size="14">make-mlops-easy observe models/deploy_20240101</text>
  <text x="152" y="580" fill="#64e2d5" font-family="monospace" font-size="14">$</text>
  <text x="170" y="580" fill="#c9d1d9" font-family="monospace" font-size="14">make-mlops-easy master start --port 8000</text>

  <!-- Title -->
  <text x="600" y="60" fill="#f4f6ff" font-family="sans-serif" font-size="28" font-weight="bold" text-anchor="middle" opacity="0.9">Easy MLOps — End-to-End ML Pipeline Framework</text>

  <!-- Tech pills top-right -->
  <rect x="130" y="100" width="62" height="22" rx="11" fill="rgba(100,226,213,0.15)"/>
  <text x="161" y="115" fill="#64e2d5" font-family="sans-serif" font-size="11" text-anchor="middle">Python</text>
  <rect x="200" y="100" width="62" height="22" rx="11" fill="rgba(93,139,253,0.15)"/>
  <text x="231" y="115" fill="#5d8bfd" font-family="sans-serif" font-size="11" text-anchor="middle">FastAPI</text>
  <rect x="270" y="100" width="62" height="22" rx="11" fill="rgba(124,93,253,0.15)"/>
  <text x="301" y="115" fill="#bc8cff" font-family="sans-serif" font-size="11" text-anchor="middle">Docker</text>
  <rect x="340" y="100" width="62" height="22" rx="11" fill="rgba(126,231,135,0.15)"/>
  <text x="371" y="115" fill="#7ee787" font-family="sans-serif" font-size="11" text-anchor="middle">MLflow</text>
</svg>
