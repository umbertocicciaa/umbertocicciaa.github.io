<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="45%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#10a37f" />
    </linearGradient>
    <radialGradient id="pulse" cx="0.76" cy="0.26" r="0.6">
      <stop offset="0%" stop-color="#10a37f" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#161b22" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10a37f" />
      <stop offset="100%" stop-color="#00d4aa" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)" />
  <rect width="1200" height="675" fill="url(#pulse)" />
  <!-- Terminal window -->
  <g opacity="0.9">
    <rect x="180" y="140" width="840" height="400" rx="16" fill="#0d1117" stroke="url(#glyph)" stroke-width="3" />
    <!-- Terminal header -->
    <rect x="180" y="140" width="840" height="50" rx="16" ry="16" fill="#161b22" />
    <rect x="180" y="165" width="840" height="25" fill="#161b22" />
    <!-- Terminal buttons -->
    <circle cx="215" cy="165" r="8" fill="#ff5f56" />
    <circle cx="243" cy="165" r="8" fill="#ffbd2e" />
    <circle cx="271" cy="165" r="8" fill="#27c93f" />
  </g>
  <!-- CLI prompt lines -->
  <g fill="#10a37f" font-family="monospace" font-size="24" opacity="0.9">
    <text x="210" y="240">$ chatgpt-cli prompt "Explain Go channels"</text>
    <text x="210" y="290" fill="#8b949e">→ Channels in Go are typed conduits...</text>
    <text x="210" y="350">$ chatgpt-cli config list</text>
    <text x="210" y="400" fill="#8b949e">OPENAI_MODEL: gpt-3.5-turbo</text>
    <text x="210" y="430" fill="#8b949e">OPENAI_MAX_TOKENS: 1000</text>
    <text x="210" y="490">$ _</text>
  </g>
  <!-- Go gopher hint -->
  <g opacity="0.3" fill="url(#glyph)">
    <circle cx="1050" cy="550" r="60" />
  </g>
</svg>
