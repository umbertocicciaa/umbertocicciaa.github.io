<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e3a"/>
      <stop offset="50%" stop-color="#241855"/>
      <stop offset="100%" stop-color="#3a2080"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#c29bff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1a0e3a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c29bff"/>
      <stop offset="100%" stop-color="#7c5dfd"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#ff9d00"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7ee787"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#79c0ff"/>
      <stop offset="100%" stop-color="#388bfd"/>
    </linearGradient>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>

  <!-- Title -->
  <text x="600" y="56" fill="#f4f6ff" font-family="sans-serif" font-size="28" font-weight="bold" text-anchor="middle" opacity="0.95">QuestMasterAI — Agentic AI for Interactive Storytelling</text>

  <!-- Phase 1: Story Generation flow (left side) -->
  <text x="320" y="108" fill="#c29bff" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Phase 1: Story Generation</text>

  <!-- Lore Document -->
  <rect x="100" y="130" width="180" height="90" rx="12" fill="rgba(194,155,255,0.12)" stroke="url(#accent)" stroke-width="2"/>
  <text x="190" y="162" fill="#c29bff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Lore Document</text>
  <text x="190" y="182" fill="#8b949e" font-family="monospace" font-size="11" text-anchor="middle">quest, characters</text>
  <text x="190" y="198" fill="#8b949e" font-family="monospace" font-size="11" text-anchor="middle">locations, items</text>

  <!-- Arrow down -->
  <line x1="190" y1="220" x2="190" y2="248" stroke="url(#accent)" stroke-width="2" opacity="0.5"/>
  <polygon points="184,248 190,260 196,248" fill="url(#accent)" opacity="0.5"/>

  <!-- Story Generator Agent -->
  <rect x="100" y="264" width="180" height="70" rx="12" fill="rgba(255,215,0,0.1)" stroke="url(#gold)" stroke-width="2"/>
  <text x="190" y="294" fill="#ffd700" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Story Generator</text>
  <text x="190" y="314" fill="#8b949e" font-family="sans-serif" font-size="11" text-anchor="middle">AI Agent (GPT-4)</text>

  <!-- Arrow down -->
  <line x1="190" y1="334" x2="190" y2="358" stroke="url(#accent)" stroke-width="2" opacity="0.5"/>
  <polygon points="184,358 190,370 196,358" fill="url(#accent)" opacity="0.5"/>

  <!-- PDDL Generator Agent -->
  <rect x="100" y="374" width="180" height="70" rx="12" fill="rgba(121,192,255,0.1)" stroke="url(#blue)" stroke-width="2"/>
  <text x="190" y="404" fill="#79c0ff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">PDDL Generator</text>
  <text x="190" y="424" fill="#8b949e" font-family="sans-serif" font-size="11" text-anchor="middle">domain + problem</text>

  <!-- Arrow down -->
  <line x1="190" y1="444" x2="190" y2="468" stroke="url(#accent)" stroke-width="2" opacity="0.5"/>
  <polygon points="184,468 190,480 196,468" fill="url(#accent)" opacity="0.5"/>

  <!-- Fast Downward Validator -->
  <rect x="100" y="484" width="180" height="70" rx="12" fill="rgba(126,231,135,0.1)" stroke="url(#green)" stroke-width="2"/>
  <text x="190" y="514" fill="#7ee787" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Fast Downward</text>
  <text x="190" y="534" fill="#8b949e" font-family="sans-serif" font-size="11" text-anchor="middle">Plan Validation</text>

  <!-- Reflection loop arrow (curved back) -->
  <path d="M280 520 C 340 520, 340 400, 280 400" fill="none" stroke="#ff7eb2" stroke-width="2" stroke-dasharray="6,4" opacity="0.6"/>
  <polygon points="282,394 278,406 286,404" fill="#ff7eb2" opacity="0.6"/>
  <text x="340" y="462" fill="#ff7eb2" font-family="sans-serif" font-size="11" text-anchor="middle" opacity="0.8">Reflection</text>
  <text x="340" y="476" fill="#ff7eb2" font-family="sans-serif" font-size="11" text-anchor="middle" opacity="0.8">Agent</text>

  <!-- Output: PDDL files -->
  <rect x="100" y="578" width="180" height="58" rx="10" fill="rgba(126,231,135,0.08)" stroke="url(#green)" stroke-width="1.5"/>
  <text x="190" y="604" fill="#7ee787" font-family="monospace" font-size="12" text-anchor="middle">domain.pddl</text>
  <text x="190" y="622" fill="#7ee787" font-family="monospace" font-size="12" text-anchor="middle">problem.pddl</text>
  <line x1="190" y1="554" x2="190" y2="576" stroke="url(#green)" stroke-width="2" opacity="0.5"/>
  <polygon points="184,576 190,586 196,576" fill="url(#green)" opacity="0.5"/>

  <!-- Divider -->
  <line x1="440" y1="100" x2="440" y2="640" stroke="#c29bff" stroke-width="1" opacity="0.2" stroke-dasharray="8,6"/>

  <!-- Phase 2: Interactive Game (right side) -->
  <text x="800" y="108" fill="#c29bff" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Phase 2: Interactive Adventure</text>

  <!-- Browser mockup -->
  <rect x="500" y="130" width="620" height="420" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <!-- Browser bar -->
  <rect x="500" y="130" width="620" height="36" rx="14" fill="#161b22"/>
  <rect x="500" y="150" width="620" height="16" fill="#161b22"/>
  <circle cx="526" cy="148" r="6" fill="#ff5f56"/>
  <circle cx="546" cy="148" r="6" fill="#ffbd2e"/>
  <circle cx="566" cy="148" r="6" fill="#27c93f"/>
  <!-- URL bar -->
  <rect x="600" y="138" width="400" height="20" rx="10" fill="rgba(255,255,255,0.06)"/>
  <text x="800" y="153" fill="#8b949e" font-family="monospace" font-size="11" text-anchor="middle">localhost:8501</text>

  <!-- Streamlit-style content -->
  <!-- Story panel -->
  <rect x="530" y="186" width="360" height="180" rx="10" fill="rgba(194,155,255,0.08)" stroke="#c29bff" stroke-width="1.5" opacity="0.8"/>
  <text x="550" y="212" fill="#c29bff" font-family="sans-serif" font-size="14" font-weight="bold">The Dark Forest Quest</text>
  <text x="550" y="236" fill="#c9d1d9" font-family="sans-serif" font-size="12">You stand at the entrance of an ancient forest.</text>
  <text x="550" y="256" fill="#c9d1d9" font-family="sans-serif" font-size="12">A mysterious light flickers between the trees...</text>
  <text x="550" y="276" fill="#c9d1d9" font-family="sans-serif" font-size="12">The old map shows two paths diverging ahead.</text>

  <!-- Choice buttons -->
  <rect x="550" y="304" width="200" height="32" rx="8" fill="url(#accent)" opacity="0.25"/>
  <text x="650" y="325" fill="#c29bff" font-family="sans-serif" font-size="13" text-anchor="middle">Follow the light</text>
  <rect x="550" y="342" width="200" height="32" rx="8" fill="url(#accent)" opacity="0.15"/>
  <text x="650" y="363" fill="#c29bff" font-family="sans-serif" font-size="13" text-anchor="middle">Take the hidden path</text>

  <!-- Stats sidebar -->
  <rect x="910" y="186" width="190" height="180" rx="10" fill="rgba(255,255,255,0.04)" stroke="#30363d" stroke-width="1"/>
  <text x="1005" y="212" fill="#f4f6ff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Quest Progress</text>

  <!-- Progress bar -->
  <rect x="930" y="228" width="150" height="8" rx="4" fill="rgba(255,255,255,0.08)"/>
  <rect x="930" y="228" width="60" height="8" rx="4" fill="url(#accent)" opacity="0.7"/>
  <text x="1005" y="252" fill="#8b949e" font-family="sans-serif" font-size="11" text-anchor="middle">Step 3 of 8</text>

  <!-- Inventory -->
  <text x="930" y="278" fill="#ffd700" font-family="sans-serif" font-size="12">Inventory</text>
  <text x="930" y="298" fill="#8b949e" font-family="monospace" font-size="11">- Ancient Map</text>
  <text x="930" y="316" fill="#8b949e" font-family="monospace" font-size="11">- Torch</text>
  <text x="930" y="334" fill="#8b949e" font-family="monospace" font-size="11">- Silver Key</text>

  <!-- Game state visualization -->
  <rect x="530" y="386" width="580" height="148" rx="10" fill="rgba(255,255,255,0.03)" stroke="#30363d" stroke-width="1"/>
  <text x="550" y="412" fill="#ffd700" font-family="sans-serif" font-size="13" font-weight="bold">PDDL State Graph</text>

  <!-- Node graph inside -->
  <circle cx="600" cy="466" r="16" fill="url(#green)" opacity="0.6"/>
  <text x="600" y="471" fill="#0d1117" font-family="sans-serif" font-size="10" text-anchor="middle">S</text>
  <circle cx="700" cy="436" r="14" fill="url(#accent)" opacity="0.5"/>
  <circle cx="700" cy="496" r="14" fill="url(#accent)" opacity="0.5"/>
  <circle cx="810" cy="436" r="14" fill="url(#accent)" opacity="0.5"/>
  <circle cx="810" cy="496" r="14" fill="url(#accent)" opacity="0.5"/>
  <circle cx="910" cy="466" r="14" fill="url(#accent)" opacity="0.5"/>
  <circle cx="1020" cy="466" r="16" fill="url(#gold)" opacity="0.6"/>
  <text x="1020" y="471" fill="#0d1117" font-family="sans-serif" font-size="10" text-anchor="middle">G</text>

  <!-- Graph edges -->
  <line x1="616" y1="460" x2="686" y2="440" stroke="#c29bff" stroke-width="1.5" opacity="0.4"/>
  <line x1="616" y1="472" x2="686" y2="492" stroke="#c29bff" stroke-width="1.5" opacity="0.4"/>
  <line x1="714" y1="436" x2="796" y2="436" stroke="#c29bff" stroke-width="1.5" opacity="0.4"/>
  <line x1="714" y1="496" x2="796" y2="496" stroke="#c29bff" stroke-width="1.5" opacity="0.4"/>
  <line x1="824" y1="442" x2="898" y2="462" stroke="#c29bff" stroke-width="1.5" opacity="0.4"/>
  <line x1="824" y1="490" x2="898" y2="470" stroke="#c29bff" stroke-width="1.5" opacity="0.4"/>
  <line x1="924" y1="466" x2="1004" y2="466" stroke="#ffd700" stroke-width="2" opacity="0.5"/>

  <!-- Bottom CLI -->
  <rect x="500" y="574" width="620" height="62" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5" opacity="0.85"/>
  <text x="524" y="600" fill="#c29bff" font-family="monospace" font-size="13">$</text>
  <text x="540" y="600" fill="#c9d1d9" font-family="monospace" font-size="13">python -m questmaster.cli run</text>
  <text x="524" y="622" fill="#8b949e" font-family="monospace" font-size="12">Phase 1 complete. Launching Streamlit frontend...</text>
</svg>
