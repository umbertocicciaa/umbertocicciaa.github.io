<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1630"/>
      <stop offset="50%" stop-color="#1a2650"/>
      <stop offset="100%" stop-color="#2a3870"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.3" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#e1306c" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0e1630" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ig" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f09433"/>
      <stop offset="25%" stop-color="#e6683c"/>
      <stop offset="50%" stop-color="#dc2743"/>
      <stop offset="75%" stop-color="#cc2366"/>
      <stop offset="100%" stop-color="#bc1888"/>
    </linearGradient>
    <linearGradient id="tw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1da1f2"/>
      <stop offset="100%" stop-color="#0d8bd9"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7ee787"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#halo)"/>

  <!-- Title -->
  <text x="600" y="50" fill="#f4f6ff" font-family="sans-serif" font-size="26" font-weight="bold" text-anchor="middle" opacity="0.95">Instagram + Twitter Clone — Full-Stack Social Platform</text>

  <!-- Left panel: Feed view (Instagram-style) -->
  <rect x="60" y="80" width="500" height="530" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <!-- Header bar -->
  <rect x="60" y="80" width="500" height="44" rx="16" fill="#161b22"/>
  <rect x="60" y="108" width="500" height="16" fill="#161b22"/>
  <text x="310" y="107" fill="#f4f6ff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Feed</text>

  <!-- Post 1 -->
  <rect x="88" y="140" width="444" height="200" rx="12" fill="rgba(255,255,255,0.04)" stroke="#30363d" stroke-width="1"/>
  <!-- User header -->
  <circle cx="118" cy="168" r="18" fill="url(#ig)" opacity="0.7"/>
  <text x="146" y="164" fill="#f4f6ff" font-family="sans-serif" font-size="14" font-weight="bold">alice_dev</text>
  <text x="146" y="182" fill="#8b949e" font-family="sans-serif" font-size="11">2 hours ago</text>
  <!-- Image placeholder -->
  <rect x="104" y="196" width="412" height="100" rx="8" fill="rgba(225,48,108,0.1)" stroke="url(#ig)" stroke-width="1" opacity="0.4"/>
  <text x="310" y="252" fill="#8b949e" font-family="sans-serif" font-size="14" text-anchor="middle" opacity="0.6">Photo content</text>
  <!-- Interaction bar -->
  <text x="118" y="320" fill="#e1306c" font-family="sans-serif" font-size="14">&#9829; 42</text>
  <text x="180" y="320" fill="#8b949e" font-family="sans-serif" font-size="14">&#128172; 7</text>

  <!-- Post 2 -->
  <rect x="88" y="352" width="444" height="130" rx="12" fill="rgba(255,255,255,0.04)" stroke="#30363d" stroke-width="1"/>
  <circle cx="118" cy="380" r="18" fill="url(#tw)" opacity="0.7"/>
  <text x="146" y="376" fill="#f4f6ff" font-family="sans-serif" font-size="14" font-weight="bold">bob_codes</text>
  <text x="146" y="394" fill="#8b949e" font-family="sans-serif" font-size="11">5 hours ago</text>
  <text x="118" y="424" fill="#c9d1d9" font-family="sans-serif" font-size="13">Just deployed my new microservice!</text>
  <text x="118" y="444" fill="#c9d1d9" font-family="sans-serif" font-size="13">Spring Boot + Angular = perfect combo</text>
  <text x="118" y="468" fill="#1da1f2" font-family="sans-serif" font-size="14">&#9829; 89</text>
  <text x="180" y="468" fill="#8b949e" font-family="sans-serif" font-size="14">&#128172; 15</text>

  <!-- New post input -->
  <rect x="88" y="500" width="444" height="42" rx="10" fill="rgba(255,255,255,0.04)" stroke="#30363d" stroke-width="1"/>
  <text x="118" y="526" fill="#8b949e" font-family="sans-serif" font-size="13">Write a post...</text>
  <rect x="460" y="508" width="58" height="26" rx="8" fill="url(#ig)" opacity="0.6"/>
  <text x="489" y="526" fill="#fff" font-family="sans-serif" font-size="12" text-anchor="middle">Post</text>

  <!-- Right panel: Architecture diagram -->
  <rect x="600" y="80" width="540" height="290" rx="16" fill="rgba(255,255,255,0.03)" stroke="#30363d" stroke-width="1.5"/>
  <text x="870" y="112" fill="#f4f6ff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Architecture</text>

  <!-- Angular Frontend -->
  <rect x="630" y="138" width="160" height="60" rx="10" fill="rgba(221,0,49,0.1)" stroke="#dd0031" stroke-width="2"/>
  <text x="710" y="166" fill="#dd0031" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Angular</text>
  <text x="710" y="184" fill="#8b949e" font-family="sans-serif" font-size="11" text-anchor="middle">Frontend SPA</text>

  <!-- Arrow -->
  <line x1="790" y1="168" x2="830" y2="168" stroke="#8b949e" stroke-width="1.5" opacity="0.5"/>
  <polygon points="830,163 842,168 830,173" fill="#8b949e" opacity="0.5"/>
  <text x="810" y="158" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">REST</text>

  <!-- Spring Boot Backend -->
  <rect x="848" y="138" width="160" height="60" rx="10" fill="rgba(109,179,63,0.1)" stroke="#6db33f" stroke-width="2"/>
  <text x="928" y="166" fill="#6db33f" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Spring Boot</text>
  <text x="928" y="184" fill="#8b949e" font-family="sans-serif" font-size="11" text-anchor="middle">Backend API</text>

  <!-- Arrow down -->
  <line x1="928" y1="198" x2="928" y2="230" stroke="#8b949e" stroke-width="1.5" opacity="0.5"/>
  <polygon points="922,230 928,242 934,230" fill="#8b949e" opacity="0.5"/>

  <!-- PostgreSQL -->
  <rect x="848" y="246" width="160" height="60" rx="10" fill="rgba(51,103,145,0.15)" stroke="#336791" stroke-width="2"/>
  <text x="928" y="274" fill="#336791" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">PostgreSQL</text>
  <text x="928" y="292" fill="#8b949e" font-family="sans-serif" font-size="11" text-anchor="middle">Database</text>

  <!-- JWT Auth -->
  <rect x="630" y="246" width="160" height="60" rx="10" fill="rgba(255,193,7,0.1)" stroke="#ffc107" stroke-width="2"/>
  <text x="710" y="274" fill="#ffc107" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">JWT Auth</text>
  <text x="710" y="292" fill="#8b949e" font-family="sans-serif" font-size="11" text-anchor="middle">Token-based security</text>

  <!-- Arrow JWT -> Spring -->
  <line x1="790" y1="276" x2="846" y2="276" stroke="#ffc107" stroke-width="1.5" opacity="0.4" stroke-dasharray="4,3"/>

  <!-- API Endpoints list -->
  <rect x="600" y="394" width="540" height="216" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5" opacity="0.9"/>
  <text x="870" y="424" fill="#f4f6ff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">REST API Endpoints</text>

  <text x="632" y="456" fill="#7ee787" font-family="monospace" font-size="13">POST</text>
  <text x="692" y="456" fill="#c9d1d9" font-family="monospace" font-size="13">/api/users/register</text>
  <text x="632" y="480" fill="#7ee787" font-family="monospace" font-size="13">POST</text>
  <text x="692" y="480" fill="#c9d1d9" font-family="monospace" font-size="13">/api/users/login</text>
  <text x="632" y="504" fill="#79c0ff" font-family="monospace" font-size="13">GET</text>
  <text x="692" y="504" fill="#c9d1d9" font-family="monospace" font-size="13">/api/users/{id}</text>
  <text x="632" y="528" fill="#7ee787" font-family="monospace" font-size="13">POST</text>
  <text x="692" y="528" fill="#c9d1d9" font-family="monospace" font-size="13">/api/posts</text>
  <text x="632" y="552" fill="#7ee787" font-family="monospace" font-size="13">POST</text>
  <text x="692" y="552" fill="#c9d1d9" font-family="monospace" font-size="13">/api/posts/{id}/like</text>
  <text x="632" y="576" fill="#7ee787" font-family="monospace" font-size="13">POST</text>
  <text x="692" y="576" fill="#c9d1d9" font-family="monospace" font-size="13">/api/posts/{id}/comments</text>
  <text x="632" y="600" fill="#ff7b72" font-family="monospace" font-size="13">DEL</text>
  <text x="692" y="600" fill="#c9d1d9" font-family="monospace" font-size="13">/api/users/{id}/unfollow</text>

  <!-- Tech pills at bottom -->
  <rect x="112" y="630" width="58" height="22" rx="11" fill="rgba(109,179,63,0.15)"/>
  <text x="141" y="645" fill="#6db33f" font-family="sans-serif" font-size="11" text-anchor="middle">Java</text>
  <rect x="178" y="630" width="72" height="22" rx="11" fill="rgba(221,0,49,0.15)"/>
  <text x="214" y="645" fill="#dd0031" font-family="sans-serif" font-size="11" text-anchor="middle">Angular</text>
  <rect x="258" y="630" width="90" height="22" rx="11" fill="rgba(51,103,145,0.15)"/>
  <text x="303" y="645" fill="#336791" font-family="sans-serif" font-size="11" text-anchor="middle">PostgreSQL</text>
  <rect x="356" y="630" width="50" height="22" rx="11" fill="rgba(255,193,7,0.15)"/>
  <text x="381" y="645" fill="#ffc107" font-family="sans-serif" font-size="11" text-anchor="middle">JWT</text>
</svg>
