<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1a30"/>
      <stop offset="50%" stop-color="#1a2848"/>
      <stop offset="100%" stop-color="#2a3e6e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#ffcc02" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f1a30" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="genius" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffff64"/>
      <stop offset="100%" stop-color="#ffcc02"/>
    </linearGradient>
    <linearGradient id="kotlin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7f52ff"/>
      <stop offset="100%" stop-color="#c711e1"/>
    </linearGradient>
    <linearGradient id="android" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3ddc84"/>
      <stop offset="100%" stop-color="#34a853"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>

  <!-- Phone mockup -->
  <rect x="380" y="50" width="340" height="590" rx="36" fill="#0d1117" stroke="#444" stroke-width="3"/>
  <!-- Screen -->
  <rect x="395" y="80" width="310" height="530" rx="20" fill="#161b22"/>
  <!-- Status bar -->
  <rect x="395" y="80" width="310" height="30" rx="20" fill="#1c2333"/>
  <rect x="395" y="100" width="310" height="10" fill="#1c2333"/>
  <text x="550" y="97" fill="#8b949e" font-family="sans-serif" font-size="11" text-anchor="middle">9:41</text>
  <!-- Notch -->
  <rect x="490" y="52" width="120" height="24" rx="12" fill="#0d1117"/>

  <!-- App header -->
  <rect x="395" y="110" width="310" height="48" fill="#1c2333"/>
  <text x="550" y="140" fill="#ffcc02" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">SongFinder</text>

  <!-- Search bar -->
  <rect x="415" y="170" width="270" height="38" rx="19" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="438" y="194" fill="#8b949e" font-family="sans-serif" font-size="14">Search songs...</text>
  <!-- Search icon -->
  <circle cx="668" cy="189" r="8" fill="none" stroke="#ffcc02" stroke-width="2" opacity="0.6"/>
  <line x1="674" y1="195" x2="680" y2="201" stroke="#ffcc02" stroke-width="2" opacity="0.6"/>

  <!-- Song result 1 (active/selected) -->
  <rect x="415" y="224" width="270" height="72" rx="12" fill="rgba(255,204,2,0.1)" stroke="#ffcc02" stroke-width="1.5" opacity="0.9"/>
  <!-- Album art placeholder -->
  <rect x="428" y="236" width="48" height="48" rx="8" fill="url(#genius)" opacity="0.3"/>
  <text x="452" y="266" fill="#ffcc02" font-family="sans-serif" font-size="18" text-anchor="middle" opacity="0.7">&#9835;</text>
  <text x="490" y="256" fill="#f4f6ff" font-family="sans-serif" font-size="14" font-weight="bold">Bohemian Rhapsody</text>
  <text x="490" y="274" fill="#8b949e" font-family="sans-serif" font-size="12">Queen</text>
  <text x="668" y="266" fill="#ffcc02" font-family="sans-serif" font-size="16" text-anchor="middle">&#8250;</text>

  <!-- Song result 2 -->
  <rect x="415" y="306" width="270" height="72" rx="12" fill="rgba(255,255,255,0.03)" stroke="#30363d" stroke-width="1"/>
  <rect x="428" y="318" width="48" height="48" rx="8" fill="rgba(127,82,255,0.15)"/>
  <text x="452" y="348" fill="#7f52ff" font-family="sans-serif" font-size="18" text-anchor="middle" opacity="0.7">&#9835;</text>
  <text x="490" y="338" fill="#f4f6ff" font-family="sans-serif" font-size="14" font-weight="bold">Stairway to Heaven</text>
  <text x="490" y="356" fill="#8b949e" font-family="sans-serif" font-size="12">Led Zeppelin</text>

  <!-- Song result 3 -->
  <rect x="415" y="388" width="270" height="72" rx="12" fill="rgba(255,255,255,0.03)" stroke="#30363d" stroke-width="1"/>
  <rect x="428" y="400" width="48" height="48" rx="8" fill="rgba(61,220,132,0.15)"/>
  <text x="452" y="430" fill="#3ddc84" font-family="sans-serif" font-size="18" text-anchor="middle" opacity="0.7">&#9835;</text>
  <text x="490" y="420" fill="#f4f6ff" font-family="sans-serif" font-size="14" font-weight="bold">Imagine</text>
  <text x="490" y="438" fill="#8b949e" font-family="sans-serif" font-size="12">John Lennon</text>

  <!-- Search history section -->
  <text x="428" y="486" fill="#8b949e" font-family="sans-serif" font-size="12" font-weight="bold">Recent Searches</text>
  <rect x="415" y="496" width="270" height="36" rx="8" fill="rgba(255,255,255,0.02)" stroke="#30363d" stroke-width="0.5"/>
  <text x="435" y="519" fill="#8b949e" font-family="sans-serif" font-size="12">&#128337; Hotel California</text>
  <rect x="415" y="536" width="270" height="36" rx="8" fill="rgba(255,255,255,0.02)" stroke="#30363d" stroke-width="0.5"/>
  <text x="435" y="559" fill="#8b949e" font-family="sans-serif" font-size="12">&#128337; Come As You Are</text>

  <!-- Bottom nav bar -->
  <rect x="395" y="580" width="310" height="30" rx="0" fill="#1c2333"/>
  <rect x="395" y="590" width="310" height="20" rx="20" fill="#1c2333"/>
  <line x1="510" y1="600" x2="590" y2="600" stroke="#8b949e" stroke-width="4" stroke-linecap="round" opacity="0.3"/>

  <!-- Left side: Song detail panel -->
  <rect x="60" y="100" width="290" height="470" rx="16" fill="rgba(255,255,255,0.03)" stroke="#30363d" stroke-width="1.5"/>
  <text x="205" y="136" fill="#ffcc02" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Song Details</text>

  <!-- Album art large -->
  <rect x="110" y="156" width="190" height="130" rx="12" fill="rgba(255,204,2,0.08)" stroke="#ffcc02" stroke-width="1" opacity="0.5"/>
  <text x="205" y="228" fill="#ffcc02" font-family="sans-serif" font-size="40" text-anchor="middle" opacity="0.4">&#9835;</text>

  <!-- Song info -->
  <text x="205" y="312" fill="#f4f6ff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Bohemian Rhapsody</text>
  <text x="205" y="336" fill="#8b949e" font-family="sans-serif" font-size="14" text-anchor="middle">Queen</text>
  <text x="205" y="358" fill="#8b949e" font-family="sans-serif" font-size="12" text-anchor="middle">Album: A Night at the Opera</text>
  <text x="205" y="378" fill="#8b949e" font-family="sans-serif" font-size="12" text-anchor="middle">Released: 1975</text>

  <!-- Lyrics preview -->
  <rect x="88" y="398" width="234" height="100" rx="10" fill="rgba(255,255,255,0.03)"/>
  <text x="205" y="422" fill="#ffcc02" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Lyrics Preview</text>
  <text x="105" y="444" fill="#8b949e" font-family="sans-serif" font-size="11" font-style="italic">Is this the real life?</text>
  <text x="105" y="460" fill="#8b949e" font-family="sans-serif" font-size="11" font-style="italic">Is this just fantasy?</text>
  <text x="105" y="476" fill="#8b949e" font-family="sans-serif" font-size="11" font-style="italic">Caught in a landslide...</text>
  <text x="105" y="492" fill="#8b949e" font-family="sans-serif" font-size="11" font-style="italic">No escape from reality</text>

  <!-- Genius badge -->
  <rect x="148" y="516" width="114" height="30" rx="15" fill="url(#genius)" opacity="0.2"/>
  <text x="205" y="536" fill="#ffcc02" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Genius API</text>

  <!-- Right side: Architecture -->
  <rect x="760" y="100" width="380" height="470" rx="16" fill="rgba(255,255,255,0.03)" stroke="#30363d" stroke-width="1.5"/>
  <text x="950" y="136" fill="#f4f6ff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Architecture</text>

  <!-- Android App layer -->
  <rect x="790" y="160" width="320" height="60" rx="10" fill="rgba(61,220,132,0.1)" stroke="url(#android)" stroke-width="2"/>
  <text x="950" y="188" fill="#3ddc84" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Android App (Kotlin)</text>
  <text x="950" y="208" fill="#8b949e" font-family="sans-serif" font-size="11" text-anchor="middle">Activities + Fragments + MVVM</text>

  <line x1="950" y1="220" x2="950" y2="246" stroke="#8b949e" stroke-width="1.5" opacity="0.4"/>
  <polygon points="944,246 950,256 956,246" fill="#8b949e" opacity="0.4"/>

  <!-- Genius API layer -->
  <rect x="790" y="260" width="320" height="60" rx="10" fill="rgba(255,204,2,0.1)" stroke="#ffcc02" stroke-width="2"/>
  <text x="950" y="288" fill="#ffcc02" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Genius API</text>
  <text x="950" y="308" fill="#8b949e" font-family="sans-serif" font-size="11" text-anchor="middle">Song search, lyrics, metadata</text>

  <line x1="950" y1="320" x2="950" y2="346" stroke="#8b949e" stroke-width="1.5" opacity="0.4"/>
  <polygon points="944,346 950,356 956,346" fill="#8b949e" opacity="0.4"/>

  <!-- SQLite layer -->
  <rect x="790" y="360" width="320" height="60" rx="10" fill="rgba(0,122,204,0.1)" stroke="#007acc" stroke-width="2"/>
  <text x="950" y="388" fill="#007acc" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">SQLite</text>
  <text x="950" y="408" fill="#8b949e" font-family="sans-serif" font-size="11" text-anchor="middle">Offline search history cache</text>

  <!-- Features list -->
  <rect x="790" y="440" width="320" height="112" rx="10" fill="rgba(255,255,255,0.03)"/>
  <text x="810" y="466" fill="#f4f6ff" font-family="sans-serif" font-size="13" font-weight="bold">Key Features</text>
  <text x="810" y="488" fill="#7ee787" font-family="sans-serif" font-size="12">&#10003; Song search with Genius API</text>
  <text x="810" y="508" fill="#7ee787" font-family="sans-serif" font-size="12">&#10003; Offline-friendly search history</text>
  <text x="810" y="528" fill="#7ee787" font-family="sans-serif" font-size="12">&#10003; Rich lyrics and metadata</text>
  <text x="810" y="548" fill="#7ee787" font-family="sans-serif" font-size="12">&#10003; Material Design UI</text>

  <!-- Bottom tech pills -->
  <rect x="430" y="638" width="62" height="22" rx="11" fill="rgba(127,82,255,0.15)"/>
  <text x="461" y="653" fill="#7f52ff" font-family="sans-serif" font-size="11" text-anchor="middle">Kotlin</text>
  <rect x="500" y="638" width="72" height="22" rx="11" fill="rgba(61,220,132,0.15)"/>
  <text x="536" y="653" fill="#3ddc84" font-family="sans-serif" font-size="11" text-anchor="middle">Android</text>
  <rect x="580" y="638" width="72" height="22" rx="11" fill="rgba(255,204,2,0.15)"/>
  <text x="616" y="653" fill="#ffcc02" font-family="sans-serif" font-size="11" text-anchor="middle">Genius</text>
  <rect x="660" y="638" width="62" height="22" rx="11" fill="rgba(0,122,204,0.15)"/>
  <text x="691" y="653" fill="#007acc" font-family="sans-serif" font-size="11" text-anchor="middle">SQLite</text>
</svg>
